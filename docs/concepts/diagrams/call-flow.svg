<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="call-flow-title call-flow-desc" id="call-flow-root">
        <title id="call-flow-title">How a phone call reaches the AI agent</title>
        <desc id="call-flow-desc">A customer's call goes through Exotel to our voice engine, which talks to the AI models and sends the reply audio back the same way.</desc>
        <defs>
      <style>#call-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #call-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #call-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #call-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="call-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="call-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="call-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

