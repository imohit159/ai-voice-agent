      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #proposed-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #proposed-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #proposed-architecture-root .diagram-container { overflow-x: visible; }</style>
