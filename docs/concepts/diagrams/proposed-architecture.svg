        <title id="proposed-architecture-title">Proposed setup with a Pipecat voice service</title>
        <desc id="proposed-architecture-desc">The TypeScript calls API dials through Exotel, Exotel streams call audio to a new Pipecat voice service on the same VPS, and the voice service reports outcomes back to the API.</desc>
