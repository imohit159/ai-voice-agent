<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="build-options-title build-options-desc" id="build-options-root">
        <title id="build-options-title">Build options by effort and control</title>
        <desc id="build-options-desc">Quadrant placing a self-hosted Pipecat service in the low-effort, high-control corner, ahead of custom code, LiveKit, Pipecat Cloud and managed agent platforms.</desc>
        <defs>
      <style>#build-options-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #build-options-root { font-family: var(--font-sans); color: var(--color-ink); }
      #build-options-root .diagram-container { width: 100%; overflow-x: auto; }
      #build-options-root .diagram-container { overflow-x: visible; }</style>
          <marker id="build-options-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="build-options-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="build-options-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="120" y1="216" x2="840" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#build-options-arrow)"/>
        <line x1="480" y1="376" x2="480" y2="56" stroke="#4f5d75" stroke-width="1" marker-end="url(#build-options-arrow)"/>
        <text x="480" y="44" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">CONTROL</text>
        <text x="852" y="216" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" dominant-baseline="middle" letter-spacing="0.18em">EFFORT</text>
        <text x="136" y="80" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">SWEET SPOT</text>
        <text x="824" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">FULL CONTROL</text>
        <text x="136" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">FASTEST LAUNCH</text>
        <text x="824" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">AVOID</text>
        <circle cx="296" cy="120" r="6" fill="#bf4520"/>
        <text x="308" y="124" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif">Pipecat · self-hosted</text>
        <circle cx="216" cy="172" r="4" fill="#2d3142"/>
        <text x="228" y="176" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Pipecat Cloud</text>
        <circle cx="600" cy="100" r="4" fill="#2d3142"/>
        <text x="612" y="104" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Custom TypeScript (today)</text>
        <circle cx="680" cy="160" r="4" fill="#2d3142"/>
        <text x="692" y="164" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">LiveKit Agents + SIP</text>
        <circle cx="176" cy="300" r="4" fill="#2d3142"/>
        <text x="188" y="304" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Managed agent (Sarvam, Vapi)</text>
        <line x1="48" y1="400" x2="912" y2="400" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="48" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <circle cx="56" cy="430" r="6" fill="#bf4520"/>
        <text x="72" y="433" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Proposed</text>
        <circle cx="148" cy="430" r="4" fill="#2d3142"/>
        <text x="164" y="433" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Alternative</text>
        <text x="244" y="433" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" font-style="italic">Positions are judgment calls, not measurements.</text>
      </svg>
